syntax = "proto3";

package config;

option go_package = "src/api/config/proto;config";

import "google/protobuf/empty.proto";

service ConfigService {
    rpc AddClient(AddClientRequest) returns (AddClientResponse);
    rpc DeleteClient(DeleteClientRequest) returns (DeleteClientResponse);
    rpc DeleteClients(DeleteClientsRequest) returns (DeleteClientsResponse);
    rpc StartServer(google.protobuf.Empty) returns (StartServerResponse);
}

message DeleteClientsRequest {
    repeated string ids = 1;
}

message DeleteClientsResponse {
    string message = 1;
}

message AddClientRequest {
    string id = 1;
}

message AddClientResponse {
    string message = 1;
    bytes file = 2;
}

message DeleteClientRequest {
    string id = 1;
}

message DeleteClientResponse {
    string message = 1;
}

message StartServerResponse {
    string message = 1;
}