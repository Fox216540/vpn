syntax = "proto3";

package traffic;

option go_package = "src/api/traffic/proto;traffic";

import "google/protobuf/empty.proto";

service TrafficService {
	rpc GetTotalMbps(google.protobuf.Empty) returns (GetTotalMbpsResponse);
	rpc GetSplitMbps(google.protobuf.Empty) returns (GetSplitMbpsResponse);
}

message GetTotalMbpsResponse {
	double mbps = 1;
}

message GetSplitMbpsResponse {
	double down = 1;
	double up = 2;
}